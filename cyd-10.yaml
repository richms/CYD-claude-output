            height: 56
            radius: 10
            bg_color: 0x1E293B
            bg_opa: COVER
            border_width: 2
            border_color: 0x475569
            shadow_width: 0
            on_press:
              - if:
                  condition:
                    binary_sensor.is_on: bs_t1
                  then:
                    - homeassistant.action:
                        action: homeassistant.turn_off
                        data:
                          entity_id: "light.angle_light_white"
                  else:
                    - homeassistant.action:
                        action: homeassistant.turn_on
                        data:
                          entity_id: "light.angle_light_white"
            widgets:
              - label:
                  id: l1
                  text: "ANGLE LAMP"
                  text_font: montserrat_16
                  text_color: 0xE2E8F0
