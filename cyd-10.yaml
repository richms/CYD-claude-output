esphome:
  # Runtime display-orientation select + apply_display_orientation script;
  # priority: -100 forces this to run after ALL other components' setup()
  # (select, lvgl, etc.) - the default on_boot priority (600) ties with
  # those components and would fire too early.
  on_boot:
    priority: -100
    then:
      - script.execute: apply_display_orientation
  name: cyd-10
  friendly_name: CYD-10

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret cyd_10__encryption_key
ota:
  - platform: esphome
    password: !secret cyd_10__ota_password

wifi:
  ssid: !secret wifi_ssid_2
  password: !secret wifi_password_2

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: Cyd-10 Fallback Hotspot
    password: !secret wifi_password_2
captive_portal:

esp32:
  board: esp32dev
  framework:
    type: esp-idf

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON

spi:
  - id: tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

touchscreen:
  platform: xpt2046
  id: touch
  spi_id: touch_spi
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  update_interval: 50ms
  calibration:
    x_min: 280
    x_max: 3860
    y_min: 340
    y_max: 3860
  transform:
    swap_xy: true
    mirror_x: true
    mirror_y: true

display:
  - platform: mipi_spi
    model: ESP32-2432S028-9342
    spi_id: tft
    invert_colors: false
    color_order: rgb

time:
  - platform: homeassistant
    id: ha_time

lvgl:
  rotation: 0
  bg_color: 0x0B1220
  pages:
    - id: main_page
      bg_color: 0x0B1220
      bg_opa: COVER
      widgets:
        - obj:
            id: hdr_bg
            x: 0
            y: 0
            width: 320
            height: 34
            radius: 0
            bg_color: 0xFFB000
            bg_opa: COVER
            border_width: 0
            pad_all: 0
        - label:
            id: hdr_title
            text: "BEDROOM"
            text_font: montserrat_20
            text_color: 0x0B1220
            align: TOP_LEFT
            x: 10
            y: 6
        - label:
            id: hdr_clock
            text: "--:--"
            text_font: montserrat_16
            text_color: 0x0B1220
            align: TOP_RIGHT
            x: -10
            y: 8
        - button:
            id: t0
            x: 8
            y: 42
            width: 148
            height: 56
            radius: 10
            bg_color: 0x1E293B
            bg_opa: COVER
            border_width: 2
            border_color: 0x475569
            shadow_width: 0
            on_press:
              - if:
                  condition:
                    binary_sensor.is_on: bs_t0
                  then:
                    - homeassistant.action:
                        action: homeassistant.turn_off
                        data:
                          entity_id: "light.bedroom_downlight_1,light.bedroom_downlight_2,light.bedroom_downlight_3"
                  else:
                    - homeassistant.action:
                        action: homeassistant.turn_on
