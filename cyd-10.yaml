interval:
  - interval: 15s
    then:
      - lvgl.label.update:
          id: hdr_clock
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            return t.strftime("%H:%M");
      - lvgl.label.update:
          id: hdr_clock_portrait
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            return t.strftime("%H:%M");

binary_sensor:
  - platform: homeassistant
    id: bs_t0
    entity_id: light.bedroom_downlight_1
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: t0
                bg_color: 0xFFB000
            - lvgl.widget.update:
                id: l0
                text_color: 0x0B1220
            - lvgl.widget.update:
                id: t0_portrait
                bg_color: 0xFFB000
            - lvgl.widget.update:
                id: l0_portrait
                text_color: 0x0B1220
          else:
            - lvgl.widget.update:
                id: t0
                bg_color: 0x1E293B
            - lvgl.widget.update:
                id: l0
                text_color: 0xE2E8F0
            - lvgl.widget.update:
                id: t0_portrait
                bg_color: 0x1E293B
            - lvgl.widget.update:
                id: l0_portrait
                text_color: 0xE2E8F0

  - platform: homeassistant
    id: bs_t1
    entity_id: light.angle_light_white
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: t1
                bg_color: 0xFFB000
            - lvgl.widget.update:
                id: l1
                text_color: 0x0B1220
            - lvgl.widget.update:
                id: t1_portrait
                bg_color: 0xFFB000
            - lvgl.widget.update:
                id: l1_portrait
                text_color: 0x0B1220
          else:
            - lvgl.widget.update:
                id: t1
                bg_color: 0x1E293B
            - lvgl.widget.update:
                id: l1
                text_color: 0xE2E8F0
            - lvgl.widget.update:
                id: t1_portrait
                bg_color: 0x1E293B
            - lvgl.widget.update:
                id: l1_portrait
                text_color: 0xE2E8F0

  - platform: homeassistant
    id: bs_t2
    entity_id: light.little_red_desk_lamp
    on_state:
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: t2
                bg_color: 0xFFB000
            - lvgl.widget.update:
                id: l2
                text_color: 0x0B1220
            - lvgl.widget.update:
                id: t2_portrait
                bg_color: 0xFFB000
            - lvgl.widget.update:
                id: l2_portrait
                text_color: 0x0B1220
          else:
            - lvgl.widget.update:
                id: t2
                bg_color: 0x1E293B
            - lvgl.widget.update:
                id: l2
                text_color: 0xE2E8F0
            - lvgl.widget.update:
                id: t2_portrait
                bg_color: 0x1E293B
            - lvgl.widget.update:
                id: l2_portrait
                text_color: 0xE2E8F0

sensor:
  - platform: homeassistant
    id: s_bright
    entity_id: light.bedroom_downlight_1
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: 'return !isnan(x);'
          then:
            - lvgl.slider.update:
                id: sl_bright
                value: !lambda "return (int)(x / 255.0 * 100);"
            - lvgl.slider.update:
                id: sl_bright_portrait
                value: !lambda "return (int)(x / 255.0 * 100);"


select:
  - platform: template
    name: "Display Orientation"
    id: display_orientation
    icon: mdi:screen-rotation
    optimistic: true
    restore_value: true
    initial_option: "USB Left"
    options:
      - "USB Down"
      - "USB Right"
      - "USB Up"
      - "USB Left"
    on_value:
      then:
        - script.execute: apply_display_orientation

script:
  - id: apply_display_orientation
    then:
      - if:
          condition:
            lambda: 'return std::string(id(display_orientation).current_option()) == "USB Left";'
          then:
            - lvgl.display.set_rotation: 0
            - lvgl.page.show: main_page
      - if:
          condition:
            lambda: 'return std::string(id(display_orientation).current_option()) == "USB Up";'
          then:
            - lvgl.display.set_rotation: 90
            - lvgl.page.show: portrait_page
      - if:
          condition:
            lambda: 'return std::string(id(display_orientation).current_option()) == "USB Right";'
          then:
            - lvgl.display.set_rotation: 180
            - lvgl.page.show: main_page
      - if:
          condition:
            lambda: 'return std::string(id(display_orientation).current_option()) == "USB Down";'
          then:
            - lvgl.display.set_rotation: 270
            - lvgl.page.show: portrait_page
